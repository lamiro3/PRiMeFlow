task_name: train
train: false
test: true
ckpt_path: logs/train/runs/2026-09-30_01-04-58_primeflow-unet-gemb/checkpoints/epoch=40-step=5043.ckpt
seed: 245
data:
  transform:
    conf:
      _target_: perturbench.data.transforms.pipelines.LinearModelPipelineControls
      _partial_: true
    dependencies:
      perturbation_uniques: perturbation_uniques
      covariate_uniques: covariate_uniques
      use_perturbation_embedding: use_perturbation_embedding
  splitter:
    task: combine
    covariate_keys:
    - cell_type
    max_heldout_fraction_per_covariate: 0.7
    max_heldout_perturbations_per_covariate: 200
    train_control_fraction: 0.5
    downsample_fraction: 1.0
    splitter_seed: 42
    save: true
    output_path: ${paths.output_dir}/
  evaluation:
    split_value_to_evaluate: test
    test_data_iter_factory:
      _target_: perturbench.data.datasets.CounterfactualWithReference.from_anndata
      _partial_: true
      max_control_cells_per_covariate: 1000
      perturbation_key: ${data.data_iter_factory.perturbation_key}
      perturbation_control_value: ${data.data_iter_factory.perturbation_control_value}
      covariate_keys: ${data.data_iter_factory.covariate_keys}
      embedding_key: ${data.data_iter_factory.embedding_key}
      feature_filter_path: ${data.data_iter_factory.feature_filter_path}
      seed: ${seed}
    evaluation_pipelines:
    - aggregation: average
      metric: rmse
      rank: true
    - aggregation: pca_average
      metric: cosine
      rank: true
    - aggregation: logfc
      metric: cosine
      rank: true
    - aggregation: scores
      metric: r2_score
      rank: false
    - aggregation: scores
      metric: top_k_recall
      rank: false
    - aggregation: pca
      metric: mmd
      rank: true
    save_evaluation: true
    save_dir: ${paths.output_dir}/evaluation/
    chunk_size: 400
    print_summary: true
    use_synthetic_controls: false
    use_control_variance: false
    run_cell_eval: true
  _target_: perturbench.data.modules.AnnDataLitModule
  data:
    filename: ${paths.data_dir}/norman19_processed.h5ad
  data_iter_factory:
    _target_: perturbench.data.datasets.SingleCellPerturbationWithControls.from_anndata
    _partial_: true
    perturbation_key: condition
    perturbation_combination_delimiter: +
    perturbation_control_value: control
    covariate_keys:
    - cell_type
    embedding_key: null
    feature_filter_path: null
  mode: batch
  loader:
    batch_size: 4000
    num_workers: 8
model:
  _target_: model.Primeflow.PrimeFlow
  n_genes: null
  n_perts: null
  time_dim: 128
  sigma: 0.0
  n_ode_steps: 100
  p_uncond: 0.1
  cfg_weight: 1.0
  architecture: mlp
  hidden_dim: 1024
  unet_channels: 32
  unet_channel_mult:
  - 1
  - 2
  - 4
  - 8
  unet_num_res_blocks: 2
  unet_gene_emb_dim: 16
  use_ode_predict: true
  inject_covariates: true
  predict_chunk: 512
  pred_clip_max: 12.0
  lr: 0.001
  wd: 1.0e-05
callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    patience: 50
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    log_momentum: true
    logging_interval: epoch
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    dirpath: ${hydra:runtime.output_dir}/checkpoints
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
logger:
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${paths.output_dir}
    name: tensorboard/
    prefix: ''
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 5
  max_epochs: 500
  accelerator: gpu
  devices: 1
  precision: 32
  check_val_every_n_epoch: 1
  deterministic: false
  log_every_n_steps: 10
paths:
  data_dir: ${paths.work_dir}/data
  log_dir: ./logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
test_override:
  cfg_weight: 3.0
